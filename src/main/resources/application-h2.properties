# H2 in-memory database. Used when SPRING_PROFILES_ACTIVE=h2.
# No Supabase or .env required — handy for local dev when you don't
# have network access to Supabase.
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Supabase storage is unreachable without real creds. Skip photo upload
# in this profile by leaving the URL blank; the multipart endpoint will
# still be reachable but will return 400 for any photo part.
