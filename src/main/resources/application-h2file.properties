# H2 in FILE mode. Data persists between restarts at ~/xd-app-h2.mv.db.
# Use this when you want a local DB that survives `./gradlew bootRun` restarts.
# Activate with: --spring.profiles.active=h2file
spring.datasource.url=jdbc:h2:file:~/xd-app-h2;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Force local photo storage even when .env sets SUPABASE_URL.
# PhotoService falls back to disk when these are blank.
supabase.url=
supabase.key=
supabase.bucket=

# Local photo storage. LocalUploadsController serves /uploads/** from this dir.
uploads.local-dir=./uploads
uploads.public-base=http://localhost:8080/api/v1/uploads
