# H2 in FILE mode. Data persists between restarts at ~/xd-app-h2.mv.db.
# Use this when you want a local DB that survives `./gradlew bootRun` restarts.
# Activate with: --spring.profiles.active=h2file
spring.datasource.url=jdbc:h2:file:~/xd-app-h2;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Photo upload needs the real Supabase env vars; leaving them blank makes
# the multipart PATCH endpoint return 400 if any photo part is present
# (consistent with the in-memory h2 profile).
