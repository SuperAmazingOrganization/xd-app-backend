spring.application.name=vizja-xd-backend

# PostgreSQL via Supabase (set SPRING_DATASOURCE_* in .env, see .env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api/v1

spring.mvc.problemdetails.enabled=false

# JWT (set APP_ACCESS_TOKEN_SECRET in .env for production)
app.access-token.secret=${APP_ACCESS_TOKEN_SECRET:dev-only-secret-please-override-in-env-min-64-chars-long-1234567890}
app.access-token.expiration-ms=6000000
app.refresh-token.expiration-ms=86400000

# Supabase Storage (set SUPABASE_* in .env, see .env.example)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:}

logging.level.root=DEBUG
